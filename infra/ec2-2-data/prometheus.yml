global:
  scrape_interval: 15s

scrape_configs:
  # 1. 인스턴스 1에서 돌고 있는 스프링 앱 지표 수집
  - job_name: 'spring-boot-app'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['43.203.135.23:8080']

  # 2. 인스턴스 1의 서버 자원(CPU/RAM) 지표 수집
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['43.203.135.23:9100']

  # ⭐ 3. 인스턴스 2 (MySQL / 자기 자신)의 서버 자원 지표 수집 추가
  - job_name: 'node-exporter-ec2-2'
    static_configs:
      - targets: [ 'node-exporter:9100' ]